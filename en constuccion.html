<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estamos trabajando en esta sección</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-aviso {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .icono-aviso {
            font-size: 3rem;
            color: #ff6600; /* Naranja Zory */
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 0.88rem;
            color: #64748b;
            margin: 0 0 25px 0;
            line-height: 1.5;
        }

        .btn-proximamente {
            background: linear-gradient(135deg, #ff6600, #e65c00); /* Degradado naranja Zory */
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, filter 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-proximamente:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

    <div class="card-aviso">
        <div class="icono-aviso">
            <i class="fa-solid fa-person-digging"></i>
        </div>
        
        <h1>Estamos trabajando en esta sección</h1>
        <p>Pronto tendremos novedades increíbles disponibles para ti en este apartado.</p>

        <!-- Botón que redirige al inicio con el color naranja de Zory -->
        <a href="index.html" class="btn-proximamente">
            <i class="fa-solid fa-house"></i> Volver al inicio
        </a>
    </div>

</body>
</html>
