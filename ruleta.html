        /* Puntero Casino Estilo Clásico (Flecha Dorada 3D) */
        .ruleta-pointer {

            transition: transform 4.5s cubic-bezier(0.1, 0.7, 0.1, 1);

        /* Brillo cenital glossy tipo cristal sobre la rueda */

            top: 0;

    <!-- Scripts -->
    <script>
        const opcionesCenaData = [
            { nombre: "Lomito Completo 🍔" },
            { nombre: "Pizza Muzzarella 🍕" },
            { nombre: "Empanadas Surtidas 🥟" },
            { nombre: "Pizzanesa con Papas 🥩" },
            { nombre: "Hamburguesa Doble 🍔" },
            { nombre: "Picada de Lomito 🍟" },
            { nombre: "Sushi / Comida Japonesa 🍣" },
            { nombre: "Lomito Árabe 🌯" }
        ];

        let platoSeleccionadoRuleta = "";
        let gradosTotales = 0;

        function abrirRuleta() {
            document.getElementById('modalRuleta').style.display = 'flex';
        }

        function cerrarRuleta() {
            document.getElementById('modalRuleta').style.display = 'none';
        }

        function girarRuleta() {
            const wheel = document.getElementById('ruletaWheel');
            const btnGirar = document.getElementById('btnGirar');
            const btnPedir = document.getElementById('btnPedirResultado');
            const textoResultado = document.getElementById('resultadoRuletaText');

            btnGirar.disabled = true;
            btnPedir.style.display = 'none';
            textoResultado.innerText = "Girando la rueda...";

            const indiceGanador = Math.floor(Math.random() * opcionesCenaData.length);
            const gradosPorGajo = 45;
            const vueltasExtra = 360 * 5;
            
            gradosTotales += vueltasExtra + (gradosTotales % 360 ? 360 - (gradosTotales % 360) : 0) + (indiceGanador * gradosPorGajo) + (gradosPorGajo / 2);
            
            wheel.style.transform = `rotate(-${gradosTotales}deg)`;

            setTimeout(() => {
                platoSeleccionadoRuleta = opcionesCenaData[indiceGanador].nombre;
                textoResultado.innerHTML = `¡Ganador: <b style="color: #16a34a;">${platoSeleccionadoRuleta}</b>! 🎉`;
                btnGirar.disabled = false;
                btnPedir.style.display = 'inline-block';
            }, 4500);
        }

        function pedirGanadorRuleta() {
            const telefono = "595982309464"; 
            const mensaje = `Hola! Usé la ruleta de la app y me tocó cenar:\n*${platoSeleccionadoRuleta}*\nQuiero hacer el pedido por favor.`;
            const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function abrirModalReseña() {
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('mensajeExito').style.display = 'none';
            document.getElementById('mensajeReseña').value = '';
            document.getElementById('modalReseña').style.display = 'flex';
        }

        function cerrarModalReseña() {
            document.getElementById('modalReseña').style.display = 'none';
        }

        function enviarReseñaAnonima(event) {
            event.preventDefault();
            const formData = new FormData(document.getElementById('reseñaForm'));
            const btn = document.getElementById('btnEnviar');
            btn.innerText = 'Enviando...';
            btn.disabled = true;

            fetch('https://formsubmit.co/ajax/zorydelivery@gmail.com', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(() => {
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('mensajeExito').style.display = 'block';
                btn.innerText = 'Enviar';
                btn.disabled = false;
            })
            .catch(() => {
                alert('Error al enviar. Inténtalo de nuevo.');
                btn.innerText = 'Enviar';
                btn.disabled = false;
            });
        }
    </script>
